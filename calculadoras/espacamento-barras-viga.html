<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Viga — Espaçamento entre barras · NBR 6118:2023</title>
<style>
  /* ===== Padrão de interface BASE (mesmo da extensão pyRevit) ===== */
  :root {
    --preto: #000000; --corpo: #F1F3F4; --cartao: #FFFFFF; --borda: #E3E5E8; --borda-campo: #C4C7CC;
    --texto: #1F2328; --texto-2: #5F6368; --texto-3: #9AA0A6; --azul: #1A56DB;
    --verde: #1B5E20; --verde-bg: #E8F5E9; --vermelho: #C62828; --vermelho-bg: #FDECEA;
    --ambar: #8A5300; --ambar-bg: #FFF4E5;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; }
  body { font-family: "Segoe UI", -apple-system, BlinkMacSystemFont, Roboto, "Helvetica Neue", Arial, sans-serif;
         font-size: 13px; color: var(--texto); background: var(--corpo); line-height: 1.4; }
  .app { display: flex; flex-direction: column; min-height: 100vh; }

  .hdr { background: var(--preto); height: 76px; flex: 0 0 76px; display: flex; align-items: center; justify-content: space-between; padding: 0 20px; }
  .hdr img { height: 64px; width: auto; }
  .hdr-tool { color: var(--texto-3); text-align: right; font-size: 13px; line-height: 1.35; }
  .hdr-tool strong { display: block; color: var(--texto-3); font-size: 15px; font-weight: 600; }

  .corpo { flex: 1; display: grid; grid-template-columns: minmax(300px, 0.9fr) minmax(380px, 1.4fr); gap: 12px; padding: 12px; align-items: start; }
  .col { display: flex; flex-direction: column; gap: 12px; min-width: 0; }

  .card { background: var(--cartao); border: 1px solid var(--borda); border-radius: 8px; padding: 12px 14px; }
  .card-hd { display: flex; align-items: center; justify-content: space-between; margin-bottom: 8px; min-height: 22px; }
  .rot { font-size: 11px; text-transform: uppercase; letter-spacing: 0.06em; color: var(--texto-2); font-weight: 600; }
  .card > .rot { display: block; margin-bottom: 8px; }

  .g2 { display: grid; grid-template-columns: 1fr 1fr; gap: 8px 10px; }
  .f label { display: block; font-size: 12px; color: var(--texto-2); margin-bottom: 3px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .f label .un { color: var(--texto-3); }
  .f input, .f select { width: 100%; height: 30px; padding: 0 8px; border: 1px solid var(--borda-campo); border-radius: 6px;
    font: inherit; font-size: 13px; color: var(--texto); background: #fff; }
  .f input:focus, .f select:focus { outline: none; border-color: var(--azul); box-shadow: 0 0 0 3px rgba(26, 86, 219, 0.14); }

  .res-topo { display: flex; align-items: baseline; gap: 8px; flex-wrap: wrap; }
  .res-num .lbl { font-size: 13px; color: var(--texto-2); font-weight: 600; margin-right: 4px; }
  .res-num .val { font-size: 30px; font-weight: 600; line-height: 1.1; }
  .res-num .un { font-size: 13px; color: var(--texto-2); margin-left: 4px; }
  .res-sub { margin-top: 4px; font-size: 12.5px; color: var(--texto-2); }
  .kv { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px 10px; margin-top: 10px; padding-top: 10px; border-top: 1px solid var(--borda); }
  .kv div { font-size: 12px; color: var(--texto-2); }
  .kv b { display: block; font-size: 13.5px; color: var(--texto); font-weight: 600; }
  .pill { display: inline-block; padding: 1px 8px; border-radius: 10px; font-size: 11.5px; font-weight: 600; }
  .pill.ok { background: var(--verde-bg); color: var(--verde); }
  .pill.fail { background: var(--vermelho-bg); color: var(--vermelho); }
  .pill.warn { background: var(--ambar-bg); color: var(--ambar); }

  .memo { margin-top: 8px; padding-top: 6px; border-top: 1px solid var(--borda); font-size: 12.5px; line-height: 1.6; color: var(--texto-2); }
  .memo .fml { font-family: Consolas, "Courier New", monospace; font-size: 12px; color: var(--texto); background: var(--corpo); border-radius: 6px; padding: 6px 8px; margin: 4px 0 6px; }
  .memo strong { color: var(--texto); font-weight: 600; }

  .alertas:empty { display: none; }
  .alertas { margin-top: 8px; display: flex; flex-direction: column; gap: 5px; }
  .alert { padding: 6px 10px; border-radius: 6px; font-size: 12px; line-height: 1.35; border-left: 3px solid; }
  .alert-warning { background: var(--ambar-bg); color: var(--ambar); border-color: #E8A33D; }
  .alert-danger { background: var(--vermelho-bg); color: var(--vermelho); border-color: var(--vermelho); }

  .desenho svg { width: 100%; height: auto; display: block; max-height: calc(100vh - 190px); }
  .desenho svg text { font-family: "Segoe UI", -apple-system, Roboto, Arial, sans-serif; }

  .rodape { flex: 0 0 auto; background: #fff; border-top: 1px solid var(--borda); padding: 8px 16px; display: flex; justify-content: center; position: relative; }
  .credito { font-size: 11px; color: var(--texto-3); }

  @media (max-width: 860px) { .corpo { grid-template-columns: 1fr; } .desenho svg { max-height: none; } }
  @media (max-width: 520px) { .hdr { height: 60px; flex-basis: 60px; } .hdr img { height: 48px; } .kv { grid-template-columns: 1fr 1fr; } }
  @media (max-height: 760px) {
    .hdr { height: 60px; flex-basis: 60px; } .hdr img { height: 48px; }
    .corpo { gap: 10px; padding: 10px; } .col { gap: 10px; } .card { padding: 10px 12px; }
    .res-num .val { font-size: 26px; }
    .kv { margin-top: 6px; padding-top: 6px; }
    .card-hd { margin-bottom: 4px; }
    .alertas { margin-top: 6px; }
  }
</style>
</head>
<body>
<div class="app">

  <header class="hdr">
    <img src="../assets/logo-horizontal.png" alt="BASE Estruturas">
    <div class="hdr-tool"><strong>Viga — Espaçamento entre barras</strong>Armadura longitudinal · NBR 6118:2023</div>
  </header>

  <main class="corpo">
    <!-- ===== Coluna 1: dados e resultado ===== -->
    <section class="col">
      <div class="card">
        <span class="rot">Dados da viga</span>
        <div class="g2">
          <div class="f"><label for="bw">bw — largura <span class="un">(cm)</span></label><input type="number" id="bw" value="19" step="0.5" min="0"></div>
          <div class="f"><label for="cobr">c — cobrimento <span class="un">(cm)</span></label><input type="number" id="cobr" value="3" step="0.1" min="0"></div>
          <div class="f"><label for="bitolaBarra">ØL — barra longitudinal</label>
            <select id="bitolaBarra">
              <option value="5">Ø 5,0 mm</option><option value="6.3">Ø 6,3 mm</option><option value="8">Ø 8,0 mm</option>
              <option value="10" selected>Ø 10,0 mm</option><option value="12.5">Ø 12,5 mm</option><option value="16">Ø 16,0 mm</option>
              <option value="20">Ø 20,0 mm</option><option value="25">Ø 25,0 mm</option><option value="32">Ø 32,0 mm</option>
            </select>
          </div>
          <div class="f"><label for="nBarras">n — barras na camada <span class="un">(un)</span></label><input type="number" id="nBarras" value="3" step="1" min="2"></div>
          <div class="f"><label for="bitolaEstribo">Øt — estribo</label>
            <select id="bitolaEstribo">
              <option value="5" selected>Ø 5,0 mm</option><option value="6.3">Ø 6,3 mm</option><option value="8">Ø 8,0 mm</option>
              <option value="10">Ø 10,0 mm</option><option value="12.5">Ø 12,5 mm</option>
            </select>
          </div>
          <div class="f"><label for="ramos">Ramos do estribo <span class="un">(un)</span></label><input type="number" id="ramos" value="2" step="1" min="2"></div>
        </div>
      </div>

      <div class="card">
        <div class="card-hd"><span class="rot">Espaçamento livre entre barras</span><span id="status"></span></div>
        <div id="resultado"></div>
        <div class="alertas" id="alertas"></div>
        <div class="memo" id="memo"></div>
      </div>
    </section>

    <!-- ===== Coluna 2: desenho ===== -->
    <section class="col">
      <div class="card desenho">
        <div class="card-hd"><span class="rot">Corte transversal — parte inferior da viga</span><span class="credito">sem escala de altura</span></div>
        <div id="svgCorte"></div>
      </div>
    </section>
  </main>

  <footer class="rodape"><span class="credito">BASE Estruturas · espaçamento horizontal livre entre faces das barras (18.3.2.2)</span></footer>
</div>

<script>
const G_ids = ['bw', 'cobr', 'bitolaBarra', 'nBarras', 'bitolaEstribo', 'ramos'];

function fmt(v, casas = 2) {
  return v.toLocaleString('pt-BR', { minimumFractionDigits: casas, maximumFractionDigits: casas });
}
function pill(tipo, txt) { return `<span class="pill ${tipo}">${txt}</span>`; }

// ===== Cálculo (inalterado em relação à versão anterior) =====
function calcularEspacamento(bw, c, phiL_mm, n, phiT_mm, ramos) {
  const phiL = phiL_mm / 10, phiT = phiT_mm / 10;
  const ramosInternos = ramos - 2;
  const espacoUtil = bw - 2 * c - 2 * phiT - n * phiL - ramosInternos * phiT;
  const numEspacos = n - 1;
  const espacamento = espacoUtil / numEspacos;
  const espMin_cm = Math.max(20, phiL_mm) / 10;   // a_h ≥ máx(20 mm; ØL) — ver pendência sobre 1,2·dmáx
  return { phiL, phiT, ramosInternos, espacoUtil, numEspacos, espacamento, espMin_cm };
}

function calcular() {
  const bw = parseFloat(document.getElementById('bw').value) || 0;
  const c = parseFloat(document.getElementById('cobr').value) || 0;
  const phiL_mm = parseFloat(document.getElementById('bitolaBarra').value) || 0;
  const n = parseInt(document.getElementById('nBarras').value) || 0;
  const phiT_mm = parseFloat(document.getElementById('bitolaEstribo').value) || 0;
  const ramos = Math.max(2, parseInt(document.getElementById('ramos').value) || 2);

  const res = document.getElementById('resultado'), al = document.getElementById('alertas');
  const memo = document.getElementById('memo'), st = document.getElementById('status');
  al.innerHTML = '';

  if (n < 2) {
    res.innerHTML = '<div class="res-sub">—</div>'; memo.innerHTML = ''; st.innerHTML = '';
    al.innerHTML = '<div class="alert alert-danger">Informe pelo menos 2 barras longitudinais.</div>';
    desenharSVG(bw, c, phiL_mm / 10, Math.max(n, 0), phiT_mm / 10, 0, ramos, 0);
    return;
  }

  const r = calcularEspacamento(bw, c, phiL_mm, n, phiT_mm, ramos);
  const e = r.espacamento;
  const ok = e >= r.espMin_cm, impossivel = e < 0;

  st.innerHTML = impossivel ? pill('fail', 'Não cabe') : (ok ? pill('ok', 'OK') : pill('warn', 'Abaixo do mínimo'));
  res.innerHTML = `
    <div class="res-topo"><div class="res-num"><span class="lbl">e</span><span class="val">${fmt(e)}</span><span class="un">cm</span></div></div>
    <div class="res-sub">${n} Ø ${fmt(phiL_mm, phiL_mm % 1 ? 1 : 0)} mm · estribo Ø ${fmt(phiT_mm, phiT_mm % 1 ? 1 : 0)} mm com ${ramos} ramos</div>
    <div class="kv">
      <div>a<sub>h,mín</sub><b>${fmt(r.espMin_cm)} cm</b></div>
      <div>e / a<sub>h,mín</sub><b>${fmt(e / r.espMin_cm * 100, 0)} %</b></div>
      <div>Espaço útil<b>${fmt(r.espacoUtil)} cm</b></div>
    </div>`;

  const termoRamos = r.ramosInternos > 0;
  memo.innerHTML = `
    <div class="fml">e = (bw − 2c − 2·Øt − n·ØL${termoRamos ? ' − (r − 2)·Øt' : ''}) / (n − 1)</div>
    e = (${fmt(bw)} − 2·${fmt(c)} − 2·${fmt(r.phiT)} − ${n}·${fmt(r.phiL)}${termoRamos ? ` − ${r.ramosInternos}·${fmt(r.phiT)}` : ''}) / (${n} − 1)<br>
    e = (${fmt(bw)} − ${fmt(2 * c)} − ${fmt(2 * r.phiT)} − ${fmt(n * r.phiL)}${termoRamos ? ` − ${fmt(r.ramosInternos * r.phiT)}` : ''}) / ${r.numEspacos} = ${fmt(r.espacoUtil)} / ${r.numEspacos} = <strong>${fmt(e)} cm</strong><br>
    Mínimo (18.3.2.2): a<sub>h</sub> ≥ máx(2,0 cm; ØL) = <strong>${fmt(r.espMin_cm)} cm</strong> → ${ok ? 'atende' : 'não atende'}`;

  if (impossivel) {
    al.innerHTML = `<div class="alert alert-danger">Não cabe: aumentar bw, reduzir n/bitola ou usar 2 camadas.</div>`;
  } else if (!ok) {
    al.innerHTML = `<div class="alert alert-warning">e = ${fmt(e)} &lt; a<sub>h,mín</sub> = ${fmt(r.espMin_cm)} cm (18.3.2.2): redimensionar.</div>`;
  }

  desenharSVG(bw, c, r.phiL, n, r.phiT, e, ramos, r.espMin_cm);
}

// ===== Desenho do corte (parte inferior da viga) =====
function desenharSVG(bw, c, phiL, n, phiT, esp, ramos, espMin) {
  const box = document.getElementById('svgCorte');
  if (!(bw > 0)) { box.innerHTML = ''; return; }
  // Altura mostrada: trecho inferior da viga, interrompido por linha de quebra
  const hd = Math.max(bw * 0.75, c + phiT + phiL + 8);
  const VW = 540, mx = 70;                              // largura útil e margem lateral (px)
  const k = (VW - 2 * mx) / bw;                         // px por cm
  const yTop = 40;                                       // topo do trecho desenhado
  const X = cm => mx + cm * k, Y = cm => yTop + cm * k; // y medido a partir do topo do trecho
  const H = hd * k;
  const yBase = hd;                                      // face inferior (cm, no sistema do trecho)

  const COR_EST = '#1F2328', COR_BAR = '#1A56DB', COR_COTA = '#5F6368', COR_ERRO = '#C62828';
  let s = '';

  // Concreto com quebra no topo
  const nz = 8, amp = 0.35;
  let quebra = `M ${X(0)} ${Y(0)}`;
  for (let i = 1; i <= nz; i++) quebra += ` L ${X(bw * (i - 0.5) / nz)} ${Y(i % 2 ? amp : -amp)} L ${X(bw * i / nz)} ${Y(0)}`;
  s += `<path d="${quebra} L ${X(bw)} ${Y(yBase)} L ${X(0)} ${Y(yBase)} Z" fill="#F1F3F4" stroke="#1F2328" stroke-width="1.4" stroke-linejoin="round"/>`;

  // Estribo: linha de centro a c + Øt/2, cantos arredondados (dobra) — pernas abertas no topo (seção interrompida)
  const ex1 = c + phiT / 2, ex2 = bw - c - phiT / 2, ey = yBase - c - phiT / 2;
  const rr = Math.min(phiL / 2 + phiT / 2, (ex2 - ex1) / 2);
  const yEstTop = 1.2;
  s += `<path d="M ${X(ex1)} ${Y(yEstTop)} L ${X(ex1)} ${Y(ey - rr)} Q ${X(ex1)} ${Y(ey)} ${X(ex1 + rr)} ${Y(ey)} L ${X(ex2 - rr)} ${Y(ey)} Q ${X(ex2)} ${Y(ey)} ${X(ex2)} ${Y(ey - rr)} L ${X(ex2)} ${Y(yEstTop)}"
         fill="none" stroke="${COR_EST}" stroke-width="${Math.max(phiT * k, 2)}" stroke-linecap="butt" opacity="0.85"/>`;

  // Barras
  const yBar = yBase - c - phiT - phiL / 2;
  const x0 = c + phiT + phiL / 2;
  const passo = phiL + (esp > 0 ? esp : 0);
  const xB = [];
  for (let i = 0; i < n; i++) xB.push(x0 + i * passo);

  // Ramos internos (mesma regra de posicionamento da versão anterior)
  const ri = ramos - 2, xR = [];
  if (ri > 0 && n >= 2) {
    const internas = xB.slice(1, n - 1);
    if (ri === 1) xR.push(n % 2 === 1 ? xB[(n - 1) / 2] : (xB[n / 2 - 1] + xB[n / 2]) / 2);
    else if (internas.length >= ri) { const st = (internas.length - 1) / (ri - 1); for (let i = 0; i < ri; i++) xR.push(internas[Math.round(i * st)]); }
    else for (let i = 1; i <= ri; i++) xR.push(xB[0] + i / (ri + 1) * (xB[n - 1] - xB[0]));
  }
  xR.forEach(x => {
    s += `<line x1="${X(x)}" y1="${Y(yEstTop)}" x2="${X(x)}" y2="${Y(ey)}" stroke="${COR_EST}" stroke-width="${Math.max(phiT * k, 2)}" opacity="0.6" stroke-dasharray="1 0"/>`;
  });

  const erro = esp < espMin;
  xB.forEach(x => {
    s += `<circle cx="${X(x)}" cy="${Y(yBar)}" r="${(phiL / 2) * k}" fill="${COR_BAR}" stroke="#0F3B9E" stroke-width="1"/>`;
  });

  // Cotas
  const tick = (x, y) => `<line x1="${x - 4}" y1="${y + 4}" x2="${x + 4}" y2="${y - 4}" stroke="${COR_COTA}" stroke-width="1.2"/>`;
  const cota = (xa, xb, y, txt, cor = COR_COTA, peso = 600) => `
    <line x1="${xa}" y1="${y}" x2="${xb}" y2="${y}" stroke="${cor}" stroke-width="1"/>${tick(xa, y)}${tick(xb, y)}
    <text x="${(xa + xb) / 2}" y="${y - 7}" text-anchor="middle" font-size="${(xb - xa) < 34 ? 11 : 12.5}" font-weight="${peso}" fill="${cor}">${txt}</text>`;
  const ext = (x, y1, y2) => `<line x1="${x}" y1="${y1}" x2="${x}" y2="${y2}" stroke="#9AA0A6" stroke-width="0.7" stroke-dasharray="3 2"/>`;

  const yC1 = Y(yBase) + 30, yC2 = Y(yBase) + 62, yC3 = Y(yBase) + 92;
  // 1ª linha: espaçamento livre entre faces (vermelho se abaixo do mínimo)
  if (n >= 2 && esp > 0) {
    for (let i = 0; i < n - 1; i++) {
      const xa = X(xB[i] + phiL / 2), xb = X(xB[i + 1] - phiL / 2);
      s += ext(xa, Y(yBar), yC1 + 4) + ext(xb, Y(yBar), yC1 + 4);
      s += cota(xa, xb, yC1, fmt(esp, esp < 10 ? 2 : 1), erro ? COR_ERRO : COR_COTA, (xb - xa) < 34 ? 500 : 600);
    }
  }
  // 2ª linha: c + Øt | barras e espaços | Øt + c
  const xi = X(c + phiT), xf = X(bw - c - phiT);
  s += ext(X(0), Y(yBase), yC2 + 4) + ext(X(bw), Y(yBase), yC3 + 4) + ext(xi, Y(ey), yC2 + 4) + ext(xf, Y(ey), yC2 + 4);
  s += cota(X(0), xi, yC2, fmt(c + phiT, 1));
  s += cota(xi, xf, yC2, `${n} Ø${fmt(phiL * 10, phiL * 10 % 1 ? 1 : 0)} + ${Math.max(n - 1, 0)} e = ${fmt(bw - 2 * c - 2 * phiT, 2)}`, COR_COTA, 400);
  s += cota(xf, X(bw), yC2, fmt(c + phiT, 1));
  // 3ª linha: largura total
  s += cota(X(0), X(bw), yC3, `bw = ${fmt(bw, bw % 1 ? 1 : 0)} cm`, '#1F2328');

  // Rótulos laterais
  s += `<text x="${X(0) - 8}" y="${Y(yBar) + 4}" text-anchor="end" font-size="11.5" fill="${COR_COTA}">c = ${fmt(c, 1)} cm</text>`;
  s += `<text x="${X(0) - 8}" y="${Y(yBar) + 19}" text-anchor="end" font-size="11.5" fill="${COR_COTA}">Øt = ${fmt(phiT * 10, phiT * 10 % 1 ? 1 : 0)} mm</text>`;
  if (erro && esp > 0) s += `<text x="${X(bw / 2)}" y="${Y(yBar) - (phiL / 2) * k - 10}" text-anchor="middle" font-size="12" font-weight="600" fill="${COR_ERRO}">e &lt; a<tspan baseline-shift="sub" font-size="9">h,mín</tspan> = ${fmt(espMin)} cm</text>`;
  if (esp < 0) s += `<text x="${X(bw / 2)}" y="${Y(yBar) - (phiL / 2) * k - 10}" text-anchor="middle" font-size="12" font-weight="600" fill="${COR_ERRO}">Barras não cabem em uma camada</text>`;

  // Legenda
  const yL = yC3 + 36;
  s += `<g font-size="11.5" fill="${COR_COTA}">
      <circle cx="${mx + 6}" cy="${yL - 4}" r="6" fill="${COR_BAR}"/><text x="${mx + 18}" y="${yL}">Barras longitudinais Ø ${fmt(phiL * 10, phiL * 10 % 1 ? 1 : 0)} mm (${n} un)</text>
      <line x1="${mx}" y1="${yL + 14}" x2="${mx + 12}" y2="${yL + 14}" stroke="${COR_EST}" stroke-width="3" opacity="0.85"/><text x="${mx + 18}" y="${yL + 18}">Estribo Ø ${fmt(phiT * 10, phiT * 10 % 1 ? 1 : 0)} mm · ${ramos} ramos</text>
    </g>`;

  const VH = yL + 30;
  box.innerHTML = `<svg viewBox="0 0 ${VW} ${VH}" role="img" aria-label="Corte da viga com as barras longitudinais e o espaçamento entre elas">${s}</svg>`;
}

G_ids.forEach(id => { const el = document.getElementById(id); el.addEventListener('input', calcular); el.addEventListener('change', calcular); });
calcular();
</script>
</body>
</html>
