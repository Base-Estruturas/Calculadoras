<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>BASE Estruturas — Calculadoras</title>
<meta name="description" content="Calculadoras estruturais conforme NBR 6118:2023 — BASE Estruturas.">
<meta name="theme-color" content="#000000">
<meta property="og:title" content="BASE Estruturas — Calculadoras">
<meta property="og:description" content="Ferramentas internas de cálculo estrutural.">
<meta property="og:image" content="assets/logo.png">
<meta property="og:type" content="website">
<link rel="icon" type="image/png" href="assets/favicon.png">
<link rel="apple-touch-icon" href="assets/icon.png">
<link rel="stylesheet" href="assets/style.css">
</head>
<body>

<div class="app" id="app">

  <aside class="sidebar" id="sidebar" aria-label="Menu de calculadoras">
    <div class="sidebar-tools">
      <button class="btn-side" id="btn-pin" type="button" title="Fixar menu aberto" aria-pressed="false">
        <svg viewBox="0 0 24 24" width="15" height="15" aria-hidden="true"><path d="M15 3l6 6-2.2.8-3.9 3.9.6 4.6-1.5 1.5-4.2-4.2L4.5 21 3 21l0-1.5 5.4-5.3-4.2-4.2 1.5-1.5 4.6.6 3.9-3.9z" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"/></svg>
        <span id="btn-pin-txt">Fixar</span>
      </button>
      <button class="btn-side btn-side-x" id="btn-close" type="button" title="Recolher menu (Esc)" aria-label="Recolher menu">✕</button>
    </div>
    <div class="brand">
      <img src="assets/logo-horizontal.png" alt="BASE Estruturas" class="brand-logo" />
    </div>

    <div class="brand-divider"></div>

    <div class="brand-sub">Calculadoras estruturais</div>

    <div class="search">
      <input type="text" id="search" placeholder="Buscar calculadora…" autocomplete="off" />
    </div>

    <nav class="nav" id="nav"></nav>

    <div class="footer">
      <div class="version">v1.2 · 14/11/2026</div>
    </div>
  </aside>

  <main class="main">
    <header class="topbar">
      <button class="btn-menu" id="btn-menu" type="button" title="Abrir menu (Ctrl+K busca)" aria-label="Abrir menu" aria-controls="sidebar" aria-expanded="false"><span class="ico">☰</span><span class="txt">Menu</span></button>
      <div class="topbar-title" id="topbar-title">Selecione uma calculadora</div>
      <button class="btn-icon" id="btn-reload" title="Recarregar (Ctrl+R)" disabled aria-label="Recarregar">↻</button>
    </header>

    <div class="content">
      <div class="welcome" id="welcome">
        <div class="welcome-card">
          <div class="welcome-mark"></div>
          <h1>BASE Estruturas</h1>
          <p class="tag">Ferramentas de cálculo</p>
          <p class="desc">
            Dimensionamento e verificações estruturais conforme NBR 6118:2023
            e demais normas brasileiras.
          </p>
          <p class="hint">Abra o <b>☰ Menu</b> e selecione uma calculadora para começar.</p>
        </div>
      </div>

      <iframe id="frame" class="frame hidden" src="about:blank" frameborder="0" title="Calculadora ativa"></iframe>
    </div>
  </main>

  <!-- Fundo escuro do menu recolhível -->
  <div class="backdrop" id="backdrop"></div>

</div>

<script>
  // Carrega a lista e o controle sempre na versão mais recente (evita menu antigo em cache)
  (function () {
    const v = Date.now();
    const js = src => new Promise((ok, erro) => { const t = document.createElement('script'); t.src = src + '?v=' + v; t.onload = ok; t.onerror = erro; document.body.appendChild(t); });
    js('assets/calculadoras.js').then(() => js('assets/app.js'));
  })();
</script>
</body>
</html>
